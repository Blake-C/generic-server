name: ${COMPOSE_PROJECT_NAME:-generic-server}

services:
  nginx:
    image: nginx:1.31-alpine
    restart: unless-stopped
    environment:
      DOCROOT: ${DOCROOT:-/var/www/html}
    volumes:
      - ./app:/var/www/html:ro
      - ./docker/nginx/${CMS:?Set CMS to wordpress, joomla, or drupal}.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
    ports:
      - 127.0.0.1:24210:80
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  php:
    build:
      context: ./docker/php
    image: generic-server-php:8.4.26
    restart: unless-stopped
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    volumes:
      - ./app:/var/www/html
      - ./data/xdebug:/tmp/xdebug
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 9000 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  cli:
    image: digitalblake/light-cli:6.5.0
    tty: true
    stdin_open: true
    working_dir: /var/www/html
    environment:
      SHELL: /bin/zsh
      CMS: ${CMS}
      SITE_URL: ${SITE_URL}
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JOOMLA_VERSION: ${JOOMLA_VERSION:-6.1.4}
      BROWSER_SYNC_PORT: 3000
    volumes:
      - ./app:/var/www/html
      - ./data/backups:/var/www/backups
      - ./data/pnpm-store:/home/webdev/node/.local/share/pnpm/store
      - ./docker/cli/functions.zsh:/home/webdev/.config/zsh/functions.zsh:ro
      - ./docker/cli/php.ini:/etc/php84/conf.d/zz-generic-server.ini:ro
    ports:
      - 127.0.0.1:24215:3000
      - 127.0.0.1:24216:3001
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:12.3
    restart: unless-stopped
    environment:
      MARIADB_AUTO_UPGRADE: 1
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - ./data/mariadb:/var/lib/mysql
      - ./docker/mariadb/my.cnf:/etc/mysql/conf.d/generic-server.cnf:ro
    ports:
      - 127.0.0.1:24211:3306
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5.2.3
    restart: unless-stopped
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 64M
    ports:
      - 127.0.0.1:24212:80
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - 127.0.0.1:24213:8025

  webgrind:
    build:
      context: ./docker/webgrind
    image: generic-server-webgrind:1.9.4
    restart: unless-stopped
    volumes:
      - ./data/xdebug:/profiles:ro
      - ./app:/host/var/www/html:ro
    ports:
      - 127.0.0.1:24214:8080

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save '' --appendonly no
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
