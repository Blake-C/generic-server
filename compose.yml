name: ${COMPOSE_PROJECT_NAME:-generic-server}

services:
  php:
    build:
      context: ./docker/php
    image: generic-server-php:8.4.26
    restart: unless-stopped
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    volumes:
      - ./app:/var/www/html
      - ./data/xdebug:/tmp/xdebug
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 9000 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
