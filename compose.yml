name: ${COMPOSE_PROJECT_NAME:-generic-server}

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256

networks:
  backend:
    internal: true
  published: {}
  egress: {}

services:
  gateway:
    <<: *hardening
    image: nginx:1.31.6-alpine3.24
    user: nginx
    mem_limit: 128m
    cpus: 0.5
    entrypoint: ['nginx', '-g', 'daemon off;']
    tmpfs:
      - /tmp:uid=101,gid=101
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 127.0.0.1:24210:8080
      - 127.0.0.1:24211:3306
      - 127.0.0.1:24212:8082
      - 127.0.0.1:24213:8083
      - 127.0.0.1:24214:8084
    networks:
      - backend
      - published
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/gateway-health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  nginx:
    <<: *hardening
    image: nginx:1.31.6-alpine3.24
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    mem_limit: 256m
    cpus: 1
    environment:
      DOCROOT: ${DOCROOT:-/var/www/html}
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx
      - /etc/nginx/conf.d
    volumes:
      - ./app:/var/www/html:ro
      - type: bind
        source: ./docker/nginx/${CMS:?Set CMS to wordpress, joomla, drupal, generic, or the name of a template in docker/nginx}.conf.template
        target: /etc/nginx/templates/default.conf.template
        read_only: true
        bind:
          create_host_path: false
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
    networks:
      - backend
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  php:
    <<: *hardening
    build:
      context: ./docker/php
    image: generic-server-php:8.4.26
    mem_limit: 1g
    cpus: 2
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    tmpfs:
      - /tmp
    volumes:
      - ./app:/var/www/html
      - ./data/xdebug:/tmp/xdebug
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - backend
      - egress
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 9000 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  cli:
    <<: *hardening
    image: digitalblake/light-cli:6.6.0
    restart: 'no'
    read_only: false
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    tty: true
    stdin_open: true
    working_dir: /var/www/html
    environment:
      SHELL: /bin/zsh
      CMS: ${CMS}
      SITE_URL: ${SITE_URL}
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JOOMLA_VERSION: ${JOOMLA_VERSION:-6.1.4}
      BROWSER_SYNC_PORT: 3000
    volumes:
      - ./app:/var/www/html
      - ./data/backups:/var/www/backups
      - ./data/pnpm-store:/home/webdev/node/.local/share/pnpm/store
      - ./docker/cli/functions.zsh:/home/webdev/.config/zsh/functions.zsh:ro
      - ./docker/cli/php.ini:/etc/php84/conf.d/zz-generic-server.ini:ro
    ports:
      - 127.0.0.1:24215:3000
      - 127.0.0.1:24216:3001
    networks:
      - backend
      - egress
    depends_on:
      db:
        condition: service_healthy

  db:
    <<: *hardening
    image: mariadb:12.3.3-noble
    user: mysql
    mem_limit: 1g
    cpus: 2
    environment:
      MARIADB_AUTO_UPGRADE: 1
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    tmpfs:
      - /tmp
      - /run/mysqld
    volumes:
      - ./data/mariadb:/var/lib/mysql
      - ./docker/mariadb/my.cnf:/etc/mysql/conf.d/generic-server.cnf:ro
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    <<: *hardening
    image: redis:8.10.2-alpine3.23
    user: redis
    mem_limit: 192m
    cpus: 0.5
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save '' --appendonly no
    tmpfs:
      - /data
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  phpmyadmin:
    <<: *hardening
    image: phpmyadmin:5.2.3-apache
    cap_add:
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    mem_limit: 256m
    cpus: 1
    environment:
      PMA_HOST: db
      PMA_BLOWFISH_SECRET: ${PMA_BLOWFISH_SECRET:?Set PMA_BLOWFISH_SECRET in .env to 32 random characters, for example the output of openssl rand -hex 16}
      UPLOAD_LIMIT: 64M
    tmpfs:
      - /tmp
      - /var/run/apache2
      - /var/lock/apache2
      - /sessions
    volumes:
      - ./docker/phpmyadmin/config.secret.inc.php:/etc/phpmyadmin/config.secret.inc.php:ro
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    <<: *hardening
    image: axllent/mailpit:v1.31.4
    user: '65534:65534'
    mem_limit: 128m
    cpus: 0.5
    environment:
      MP_MAX_MESSAGES: 500
    tmpfs:
      - /tmp
    networks:
      - backend

  webgrind:
    <<: *hardening
    build:
      context: ./docker/webgrind
    image: generic-server-webgrind:1.9.4
    mem_limit: 512m
    cpus: 1
    tmpfs:
      - /tmp
    volumes:
      - ./data/xdebug:/profiles:ro
      - ./app:/host/var/www/html:ro
    networks:
      - backend
