memory_limit = 512M
upload_max_filesize = 30M
post_max_size = 32M
session.upload_progress.enabled = 0
max_execution_time = 300
max_input_vars = 5000
expose_php = Off
display_errors = On
log_errors = On
error_log = /proc/self/fd/2
date.timezone = America/Chicago
sendmail_path = "/usr/bin/msmtp -t -i"
