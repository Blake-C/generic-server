server_tokens off;
client_max_body_size 64M;
index index.php index.html;
charset utf-8;

add_header X-Frame-Options SAMEORIGIN always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
	application/javascript
	application/json
	application/wasm
	application/xml
	font/opentype
	image/svg+xml
	image/x-icon
	text/css
	text/plain;

location = /nginx-health {
	access_log off;
	default_type text/plain;
	return 200 "ok\n";
}

location = /favicon.ico {
	log_not_found off;
	access_log off;
}

location = /robots.txt {
	allow all;
	log_not_found off;
	access_log off;
}

location ^~ /.well-known/ {
	allow all;
}

location ~ (^|/)\. {
	return 403;
}

location ~* \.(sql|sql\.gz|log|sh|bak|orig|save|swp|dist)$ {
	return 404;
}
